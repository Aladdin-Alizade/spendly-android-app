org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Bu maşında default JAVA_HOME Java 26-dır; AGP/Kotlin hələ onu dəstəkləmir,
# ona görə build artıq quraşdırılmış JDK 21 ilə işləyir. Başqa maşında bu
# sətri silin — Gradle onda öz toolchain-ini tapacaq.
org.gradle.java.home=/Users/mac/Library/Java/JavaVirtualMachines/ms-21.0.11/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
