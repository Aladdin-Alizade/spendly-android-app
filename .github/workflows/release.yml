# Builds the app from a tag, signs it, and publishes the APK as a GitHub
# release asset — so the download is served by GitHub rather than by anything
# of mine, and the link never has to change:
#
#   https://github.com/Aladdin-Alizade/spendly-android-app/releases/latest/download/spendly.apk
#
# That URL resolves to whatever the newest release calls `spendly.apk`, which is
# why the asset is renamed rather than published as `app-release.apk`.
name: Release

# A tag is the only way in. Pushing `v1.2.3` publishes v1.2.3 and nothing else
# does, so there is no path to a release that no commit accounts for.
on:
  push:
    tags:
      - "v*"

permissions:
  # Creating the release and uploading the asset. Nothing else is needed.
  contents: write

jobs:
  apk:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # AGP does not download missing SDK components any more, so the platform
      # this app compiles against has to be here before Gradle starts. If the
      # build ever says a build-tools version is missing, this is the line that
      # names the wrong one.
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # A tag that disagrees with the version inside the app produces a release
      # whose name is a guess. Cheaper to stop here than to explain later which
      # of the two numbers was the real one.
      - name: The tag has to match versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $tag, app/build.gradle.kts says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: version

      # The build reads all of this from local.properties, the same file it
      # reads on a laptop — CI is just another machine with its own copy. The
      # file is gitignored, and `sdk.dir` is left out on purpose: without it
      # Gradle falls back to ANDROID_HOME, which the runner already sets.
      - name: Machine setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Android refuses to install an unsigned APK, so there would be nothing to release."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::No Supabase credentials. The published app will keep everything on the device, with no accounts and no sync."
          fi

          keystore="$RUNNER_TEMP/spendly-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"

          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'KEYSTORE_FILE=%s\n' "$keystore"
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties

      # `gradle.properties` pins org.gradle.java.home to a path on my laptop,
      # because the default JDK there is one AGP will not accept. A command-line
      # -D outranks the properties file, so the pin is overridden here rather
      # than edited out — the laptop keeps working and so does this.
      - name: Tests
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" test

      - name: Build
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleRelease

      # Gradle writes `app-release-unsigned.apk` instead when signing did not
      # happen. Publishing that would look like success and install on nothing.
      - name: Take the signed APK
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced — the build did not sign anything."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$apk" spendly.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **spendly.apk** — imzalanmış release buildi.

          Telefonda: faylı yüklə və aç. Android bir dəfə naməlum mənbədən
          quraşdırmağa icazə istəyəcək — Play Store-dan gəlməyən hər şey üçün
          normaldır.

          Köhnə versiyanın üstünə quraşdırılır, məlumat itmir. Hesaba bağlı
          məlumat onsuz da hesabda qalır.

          Həmişə ən son buraxılış:
          https://github.com/Aladdin-Alizade/spendly-android-app/releases/latest/download/spendly.apk
          NOTES

          gh release create "$GITHUB_REF_NAME" spendly.apk \
            --title "Spendly ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
